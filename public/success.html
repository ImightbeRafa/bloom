<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pago exitoso - Bloom</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --ink: #090611;
      --plum: #14091f;
      --violet: #612ce6;
      --cream: #fff8ef;
      --muted: #b9aec8;
      --line: rgba(255, 248, 239, 0.12);
      --panel: rgba(255, 248, 239, 0.06);
      --mint: #b7f4df;
      --success: #86efac;
      --radius: 8px;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    html {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 0%, rgba(97, 44, 230, 0.24), transparent 34vw),
        linear-gradient(180deg, var(--plum), var(--ink) 52%, #07050c);
      color: var(--cream);
      font-family: "Manrope", system-ui, sans-serif;
      line-height: 1.65;
      letter-spacing: 0;
      padding: 22px;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: min(100%, 500px);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.38);
      padding: 34px;
      text-align: center;
      animation: fadeUp 0.5s var(--ease) both;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    .logo {
      width: 118px;
      height: auto;
      margin: 0 auto 30px;
      object-fit: contain;
    }

    .icon {
      width: 72px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 26px;
      border: 1px solid rgba(183, 244, 223, 0.34);
      border-radius: 50%;
      background: rgba(183, 244, 223, 0.1);
      animation: pop 0.4s 0.2s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    @keyframes pop {
      from {
        transform: scale(0);
      }

      to {
        transform: scale(1);
      }
    }

    .icon svg {
      color: var(--success);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      color: var(--mint);
      font-size: 0.72rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--mint);
    }

    h1 {
      margin-bottom: 14px;
      color: var(--cream);
      font-family: "Fraunces", Georgia, serif;
      font-size: clamp(2.4rem, 7vw, 4.2rem);
      font-weight: 800;
      line-height: 0.95;
    }

    p {
      max-width: 34ch;
      margin: 0 auto 8px;
      color: var(--muted);
      font-size: 0.96rem;
      line-height: 1.65;
    }

    .btn {
      min-height: 52px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 24px;
      border-radius: var(--radius);
      background: var(--violet);
      color: #fff;
      padding: 0 22px;
      font-weight: 900;
      text-decoration: none;
      transition: transform 0.18s ease, background 0.18s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    @media (max-width: 520px) {
      body {
        place-items: start center;
        padding: 16px 12px;
      }

      .card {
        margin-top: 20px;
        padding: 24px 16px;
      }

      .logo {
        width: 104px;
        margin-bottom: 24px;
      }
    }
  </style>

  <!-- Meta Pixel -->
  <script>
  !function(f,b,e,v,n,t,s)
  {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};
  if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
  n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];
  s.parentNode.insertBefore(t,s)}(window, document,'script',
  'https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', '2410372076145656');
  fbq('track', 'PageView');
  </script>
  <!-- End Meta Pixel -->
</head>
<body>
  <noscript><img height="1" width="1" style="display:none"
  src="https://www.facebook.com/tr?id=2410372076145656&ev=PageView&noscript=1"
  /></noscript>

  <div class="card">
    <img src="/images/bloom-logo.png" alt="BLOOM" class="logo" />
    <div class="icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>
    <span class="eyebrow">Pago confirmado</span>
    <h1>Pago exitoso</h1>
    <p>Tu pedido ha sido confirmado.</p>
    <p>Recibir&aacute;s un correo con los detalles de tu orden y seguimiento de env&iacute;o.</p>
    <a href="/" class="btn">Volver a la tienda</a>
  </div>
  <script>
    (function () {
      var p = new URLSearchParams(window.location.search);
      var code = p.get('code') || '';
      var returnData = p.get('returnData') || p.get('return_data');
      var transactionId = p.get('tpt') || p.get('transaction_id') || p.get('tilopay-transaction') || p.get('id');
      if (!returnData) return;

      // Tilopay redirects here for ALL outcomes; code '1' = approved
      if (code && code !== '1') {
        console.warn('[Success] Payment not approved - code:', code, '- redirecting to error page');
        window.location.replace('/error.html');
        return;
      }

      fetch('/api/tilopay/confirm', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ returnData: returnData, transactionId: transactionId, code: code })
      })
        .then(function (res) { return res.json(); })
        .then(function (result) {
          if (!result || !result.success || !result.order || !result.order.orderId) return;

          // Fire browser-side Purchase only after server accepted signed returnData.
          if (typeof fbq === 'function') {
            var metaEventId = result.metaEventId || ('purchase_' + result.order.orderId + (transactionId ? '_' + transactionId : ''));
            var storageKey = 'meta_purchase_' + result.order.orderId;
            if (!sessionStorage.getItem(storageKey)) {
              sessionStorage.setItem(storageKey, '1');
              fbq('track', 'Purchase', {
                value: result.order.total,
                currency: 'CRC',
                content_ids: ['bloom-patch'],
                content_name: 'Bloom Dermal Micro-Infusion Patch',
                content_type: 'product',
                num_items: parseInt(result.order.cantidad) || 1
              }, { eventID: metaEventId });
            }
          }
        })
        .catch(function (e) { console.error('[Success] Confirm error:', e); });
    })();
  </script>
</body>
</html>
