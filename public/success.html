<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pago exitoso — Bloom</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --purple: #612CE6;
      --purple-pale: #a78bfa;
      --bg: #f8f5ff;
      --text: #1c0f3a;
      --text-muted: #5a4580;
      --gradient-text: linear-gradient(135deg, #612CE6, #a78bfa);
    }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; overflow: hidden; }
    .blob { position: fixed; border-radius: 50%; filter: blur(80px); pointer-events: none; z-index: 0; }
    .blob-1 { width: 500px; height: 500px; background: rgba(97, 44, 230, 0.40); top: -200px; left: -150px; animation: b1 14s ease-in-out infinite; }
    .blob-2 { width: 400px; height: 400px; background: rgba(167, 139, 250, 0.30); bottom: -150px; right: -100px; animation: b2 18s ease-in-out infinite; }
    @keyframes b1 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(40px,30px) scale(1.08)} }
    @keyframes b2 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-30px,-30px) scale(1.06)} }
    .card {
      position: relative; z-index: 1;
      background: rgba(255, 255, 255, 0.50);
      border: 1px solid rgba(97, 44, 230, 0.12);
      border-radius: 24px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 48px 40px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      animation: fadeUp 0.5s ease both;
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .icon {
      width: 72px; height: 72px;
      background: rgba(22, 163, 74, 0.08);
      border: 1px solid rgba(22, 163, 74, 0.25);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 28px;
      animation: pop 0.4s 0.2s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
    .icon svg { color: #16a34a; }
    h1 { font-family: 'Syne', sans-serif; font-size: 1.9rem; font-weight: 800; margin-bottom: 12px; }
    p { color: var(--text-muted); font-size: 0.95rem; line-height: 1.7; margin-bottom: 8px; }
    .logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.1rem; letter-spacing: 0.1em; background: var(--gradient-text); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 32px; display: block; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--purple), var(--purple-pale));
      color: #fff; font-family: 'Syne', sans-serif; font-weight: 700;
      padding: 13px 28px; border-radius: 50px; font-size: 0.95rem;
      margin-top: 24px; transition: transform 0.2s, box-shadow 0.2s; text-decoration: none;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(97, 44, 230, 0.25); }
  </style>

  <!-- Meta Pixel -->
  <script>
  !function(f,b,e,v,n,t,s)
  {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};
  if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
  n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];
  s.parentNode.insertBefore(t,s)}(window, document,'script',
  'https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', '2410372076145656');
  fbq('track', 'PageView');
  </script>
  <!-- End Meta Pixel -->
</head>
<body>
  <noscript><img height="1" width="1" style="display:none"
  src="https://www.facebook.com/tr?id=2410372076145656&ev=PageView&noscript=1"
  /></noscript>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="card">
    <span class="logo">BLOOM</span>
    <div class="icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>
    <h1>Pago exitoso</h1>
    <p>Tu pedido ha sido confirmado.</p>
    <p>Recibirás un correo con los detalles de tu orden y seguimiento de envío.</p>
    <a href="/" class="btn">Volver a la tienda</a>
  </div>
  <script>
    (function () {
      var p = new URLSearchParams(window.location.search);
      var returnData = p.get('returnData') || p.get('return_data');
      var transactionId = p.get('tpt') || p.get('transaction_id') || p.get('tilopay-transaction') || p.get('id');
      if (!returnData) return;

      var order;
      try { order = JSON.parse(atob(returnData)); } catch (e) { order = null; }

      fetch('/api/tilopay/confirm', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ returnData: returnData, transactionId: transactionId })
      }).catch(function (e) { console.error('[Success] Confirm error:', e); });

      // Fire browser-side Purchase event with dedup eventID
      if (order && order.orderId && typeof fbq === 'function') {
        var metaEventId = 'purchase_' + order.orderId + (transactionId ? '_' + transactionId : '');
        var storageKey = 'meta_purchase_' + order.orderId;
        if (!sessionStorage.getItem(storageKey)) {
          sessionStorage.setItem(storageKey, '1');
          var totalItems = parseInt(order.cantidad) || 1;
          fbq('track', 'Purchase', {
            value: order.total,
            currency: 'CRC',
            content_ids: ['bloom-patch'],
            content_type: 'product',
            num_items: totalItems
          }, { eventID: metaEventId });
        }
      }
    })();
  </script>
</body>
</html>
